name: Tests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: Test ${{ matrix.python-version }}
    runs-on: arc-runner-set
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv manually
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install ION DTN
        # Build dependencies and official installation steps for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc automake make autoconf libtool automake
          git clone https://github.com/nasa-jpl/ION-DTN.git
          cd ION-DTN
          autoreconf -fi
          ./configure
          make
          sudo make install
          sudo ldconfig

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Run Tests via Tox
        timeout-minutes: 10
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          export GITHUB_PATH=/usr/local/bin:$GITHUB_PATH
          uvx tox -e ${{ matrix.python-version }}

      - name: Upload ION logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ion-logs-${{ matrix.python-version }}
          path: |
            **/ion.log
            **/*.stdout
          retention-days: 1

      - name: Upload coverage data
        uses: actions/upload-artifact@v3
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov
          retention-days: 1

  coverage:
    name: Combine Coverage & Check Threshold
    needs: tests
    runs-on: arc-runner-set

    steps:
      - uses: actions/checkout@v4

      - name: Install uv manually
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Download coverage data
        uses: actions/download-artifact@v3
        with:
          path: .

      # Moves files from coverage-data-* subdirectories to the root so 'coverage combine' can find them
      - name: Flatten coverage files
        run: |
          find coverage-data-* -name ".coverage*" -type f -exec mv {} . \;
          rm -rf coverage-data-*

      - name: Combine and Report
        run: uvx tox -e coverage

  lint:
    name: Lint & Type Check
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Install uv manually
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Run Lint
        run: uvx tox -e lint

      - name: Run Type Check
        run: uvx tox -e type
