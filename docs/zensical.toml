[project]
docs_dir = "."
site_url = "https://nrichard.github.io/bespokebpv7/"
site_name = "bespokebpv7"
site_description = "Python library for creating, parsing, and modifying BPv7 (RFC 9171) bundles and LTP (RFC 5326) segments."
site_author = "Nate Richard"

copyright = "Copyright &copy; 2026, by the California Institute of Technology"

repo_url = "https://github.com/nasa-jpl/bespokebpv7"
repo_name = "nasa-jpl/bespokebpv7"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Core" = "api/core.md" },
  { "Extensions" = "api/extensions.md" },
  { "LTP" = "api/ltp.md" },
  { "TCPCL" = "api/tcpcl.md" },
  { "TCPCL Messages" = "api/tcpcl_messages.md" },
  { "TCPCL Enum" = "api/tcpcl_enum.md" },
  { "Admin Records" = "api/admin.md" },
  { "Utils" = "api/utils.md" },
  { "Security" = "api/security.md" },
  { "Bundle Params" = "api/bundle_params.md" },
  { "Bundle Lifecycle" = "guides/lifecycle.md" },
  { "LTP Integration" = "guides/ltp_integration.md" },
  { "TCPCL Parsing" = "guides/tcpcl_parsing.md" },
  { "dpkt Integration" = "guides/dpkt_integration.md" },
  { "Data Formatting" = "guides/data_formatting.md" },
  { "ION Extensions" = "guides/ion_extensions.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
